# Huy hiệu DSC Academy.
# rule: điều kiện đạt (xử lý trong static/js/app.js)
#   articles: N         đọc xong N bài viết (bất kỳ khoá nào)
#   module: slug        đọc xong toàn bộ bài của khoá
#   quiz_first: N       N bài đúng hết quiz ngay lần đầu
#   exam_perfect: slug  bài thi cuối khoá đạt 100%
#   streak: N           học N ngày liên tiếp
#   terms: N            tra N thuật ngữ khác nhau
#   explore: N          dùng N phần tương tác trong bài
#   night_owl: true     hoàn thành bài viết từ 23h đến 4h
# art: bg, a, b, c = màu khối; glyph = ký hiệu trên huy hiệu; layout 1-4
