- order: 2
  slug: kinh-te-vi-mo
  title: Kinh tế vĩ mô cho nhà đầu tư
  desc: GDP, lạm phát, lãi suất, tỷ giá và cách các chỉ số này tác động đến thị trường chứng khoán.
  intro: Thị trường chứng khoán phản ánh sức khoẻ nền kinh tế. Khoá học này giúp bạn đọc hiểu các chỉ số vĩ mô quan trọng và biết chúng ảnh hưởng thế nào đến từng nhóm ngành, từng quyết định đầu tư.
  level: basic
  outcomes:
    - Đọc hiểu các chỉ số GDP, CPI, PMI và biết số liệu được công bố ở đâu, khi nào.
    - Hiểu cách NHNN điều hành lãi suất, tỷ giá và tác động đến định giá cổ phiếu.
    - Nhận diện giai đoạn của chu kỳ kinh tế và các nhóm ngành hưởng lợi theo từng giai đoạn.
    - Đánh giá ảnh hưởng của Fed, đồng USD và giá hàng hoá thế giới lên thị trường Việt Nam.
